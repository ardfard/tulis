[package]
name = "tulis"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-component = "0.8.1"
gpui-kit-assets = "0.8.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["wayland", "x11", "font-kit"] }
tulis-core = { version = "0.1.0", path = "../tulis-core" }
unicode-segmentation = "1.13.3"

# Compile Metal shaders at startup instead of at build time, so building on
# macOS needs only the Command Line Tools, not the full Xcode app.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["runtime_shaders"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
tempfile = "3.27.0"
